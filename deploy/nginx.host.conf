# 宿主机 Nginx（systemd / 裸机部署）示例
# 用法：复制到 /etc/nginx/sites-available/langgraph 并 ln -s 到 sites-enabled
# 按需改 root、server_name、证书路径

upstream langgraph_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your.domain.example;

    # HTTPS 建议用 certbot；启用后可把 80 改成 return 301 https://$host$request_uri;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/your.domain.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your.domain.example/privkey.pem;

    root /opt/langgraph-demo/frontend/dist;
    index index.html;

    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://langgraph_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
